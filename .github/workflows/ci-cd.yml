name: CI/CD

# Mudanças só em documentação não rodam o pipeline. Um push com qualquer outro arquivo roda
# normalmente. Para forçar: Actions → CI/CD → Run workflow.
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [developer]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

      # O mesmo build vai para staging e, depois da promoção, para produção.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Push na developer: publica em staging. Prod sai pelo workflow "Promover para produção"
  # (promote.yml), que publica o mesmo build de uma execução que já passou por staging.
  staging:
    name: Staging
    needs: ci
    if: github.ref == 'refs/heads/developer' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      config: config/env/staging.json
